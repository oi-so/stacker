# Astro Stack App configuration

[app]
name = "Astro Stack App"
version = "0.1.0"
locale = "ja-JP"
default_language = "ja"
ui_theme = "system"

[paths]
project_root = "./projects"
cache_root = "./cache"
temp_root = "./temp"
output_root = "./output"
log_root = "./logs"

[input]
supported_raw = ["cr2", "cr3", "nef", "arw", "dng", "orf", "rw2", "raf"]
supported_image = ["jpg", "jpeg", "png", "tif", "tiff", "fits"]

[processing]
working_dtype = "float32"
accumulator_dtype = "float64"
save_bit_depth = 16
enable_lazy_loading = true
enable_disk_cache = true
max_memory_usage_ratio = 0.75
tile_size = 512

[calibration]
enable_dark = true
enable_flat = true
enable_flatdark = true
enable_bias = true
hot_pixel_removal = "auto"  # off | auto | dark

[alignment]
mode = "star"  # star | comet | none
preserve_transform_matrix = true
save_alignment_metadata = true

[platesolve]
backend = "astrometry_cli"
enabled = true
show_object_names = true
show_wcs_grid = true
search_radius_deg = 2.0
downsample_for_preview = true

[comet_alignment]
mode = "ra_dec"  # ra_dec | click | endpoints
interpolation = "linear"

[stacking]
method = "sigma_clipping"  # average | median | sigma_clipping | winsorized_sigma_clipping | sum | add | max
enable_weighted_stack = true
weight_method = "inverse_variance"  # inverse_variance | snr | fwhm
normalize_exposure = true
use_top_frames = false
top_frame_count = 0
top_frame_percent = 100

[drizzle]
enabled = false
scale = 1.5  # 1.5 | 2.0 | 4.0

[crop]
mode = "intersection"  # intersection | union | manual
manual_x = 0
manual_y = 0
manual_width = 0
manual_height = 0

[quality]
evaluate_star_count = true
evaluate_fwhm = true
evaluate_ellipticity = true
evaluate_background_noise = true
evaluate_saturation = true
evaluate_clouds = true
reject_failed_platesolve = true

[metadata]
preserve_exif = true
preserve_camera_info = true
preserve_lens_info = true
preserve_gps = true
write_sidecar_json = true

[logging]
enabled = true
level = "info"
show_in_ui = true
save_to_file = true

[i18n]
languages = ["ja", "en"]
default = "ja"

[ui]
show_advanced_options = false
show_log_panel = false
show_preview_panel = true
